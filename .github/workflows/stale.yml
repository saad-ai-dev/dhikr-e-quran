name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: 'This issue has been inactive for 60 days. It will be closed in 14 days if there is no further activity.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'priority: high,pinned'
