name: quran_urdu_app
description: 'Quran Urdu Accessibility & Live Audio Alignment App'
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    flutter_tts: ^4.0.2
    audioplayers: ^6.0.0
    http: ^1.2.0
    path_provider: ^2.1.2
    shared_preferences: ^2.2.2
    permission_handler: ^11.3.1
    share_plus: ^7.2.2
    vibration: ^2.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    integration_test:
        sdk: flutter
    flutter_lints: ^3.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/json/surah_fatiha.json
        - assets/json/allah_names.json
        - assets/audio/names/
        - assets/audio/fatiha/
    fonts:
        - family: NotoNastaliqUrdu
          fonts:
              - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - family: ScheherazadeNew
          fonts:
              - asset: assets/fonts/ScheherazadeNew-Regular.ttf
